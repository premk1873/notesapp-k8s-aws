apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes
  namespace: cloudnotes
  labels:
    app: cloudnotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudnotes
  template:
    metadata:
      labels:
        app: cloudnotes
    spec:
      containers:
        - name: cloudnotes
          image: premkarad18/cloudnotes-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: cloudnotes-config
            - secretRef:
                name: cloudnotes-secret
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10  
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
