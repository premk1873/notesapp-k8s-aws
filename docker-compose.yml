services:
  db:
    image: mysql:8

    container_name: notes-db

    environment:
      MYSQL_ROOT_PASSWORD: prem
      MYSQL_DATABASE: notes
      MYSQL_USER: prem
      MYSQL_PASSWORD: prem

    ports: 
      - "3306:3306"

    volumes:
      - notesdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pprem"]
      interval: 10s
      timeout: 10s
      retries: 10

  notesapp:
    build: .

    container_name: notesapp

    restart: unless-stopped

    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  notesdata: